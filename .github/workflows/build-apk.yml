name: Build & Publish Swiffle APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug keystore if present
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > app/debug.keystore || true
          fi

      - name: Make gradlew executable & Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for easy mobile download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Swiffle-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiffle-debug-apk
          path: Swiffle-debug.apk

      - name: Publish APK to GitHub Releases (Direct Mobile Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Swiffle Latest APK Build"
          body: "Tap **Swiffle-debug.apk** under Assets below to download and install directly on your Android phone."
          files: Swiffle-debug.apk
          prerelease: false
          make_latest: true
