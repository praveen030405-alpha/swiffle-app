name: Build & Publish Swiffle APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses (for compileSdk 36 auto-download)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug keystore if present
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > app/debug.keystore || true
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Swiffle-v1.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiffle-APK
          path: Swiffle-v1.0-debug.apk

      - name: Create GitHub Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: "Swiffle APK (Latest Build)"
          body: |
            ### Direct Mobile APK Download
            Tap **`Swiffle-v1.0-debug.apk`** under **Assets** below to download and install the app directly on your Android phone.
          files: Swiffle-v1.0-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
