name: Conversion debug build
on:
  push:
    branches: [feature/proof-carrying-conversion]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew -p verify installDist
      - run: bash gradlew :app:testDebugUnitTest --tests 'com.swiffle.app.conversion.proof.*' :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Swiffle-conversion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
