name: Conversion debug build
on:
  push:
    branches: [feature/proof-carrying-conversion]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew -p verify installDist
      - run: bash gradlew :app:testDebugUnitTest --tests 'com.swiffle.app.conversion.proof.*' :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Swiffle-conversion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish isolated mobile test download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: conversion-preview-${{ github.run_id }}
          name: Swiffle offline conversion preview
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          body: Android debug build for testing extracted-record integrity. Full source-fidelity certification is pending.
