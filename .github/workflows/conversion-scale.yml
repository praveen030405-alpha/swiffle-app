name: Workbook scale measurements
on:
  push:
    branches: [feature/proof-carrying-conversion]
    paths: ['app/src/test/java/com/swiffle/app/conversion/proof/WorkbookScaleTest.kt', '.github/workflows/conversion-scale.yml']
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rows: ['100000', '1000000']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Measure conversion and standalone verification logic
        env:
          SWIFFLE_BENCH_ROWS: ${{ matrix.rows }}
          SWIFFLE_BENCH_REPORT: ${{ github.workspace }}/scale.txt
        run: |
          bash gradlew :app:testDebugUnitTest --tests '*.WorkbookScaleTest'
          cat scale.txt >> "$GITHUB_STEP_SUMMARY"
          cat scale.txt
      - uses: actions/upload-artifact@v4
        with:
          name: scale-${{ matrix.rows }}
          path: scale.txt
